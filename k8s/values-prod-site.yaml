apps:

  configMaps:
    eden-cm:
      data:
        SMB_SERVER=""
        SMB_SHARE="installs"
        SMB_BASE_PATH=""
        SMB_CACHE_TTL="60"
      envTo:
        eden
    
  sealedSecrets:
    eden-secrets:
      data:
        SMB_USER="aaaaaaaaaaaaaa"
        SMB_PASSWORD="aaaaaaaaaaaaaa"
        SMB_DOMAIN="aaaaaaaaaaaaaa"
      envTo:
        eden

    # Separate from eden-secrets on purpose -- lets Argo instance tokens be
    # rotated/access-controlled independently of the SMB/other secrets
    # above. One key per real Argo instance, each sealed individually --
    # rotating ARGO_TOKEN_A's value never touches ARGO_TOKEN_B's ciphertext.
    # Suffix (A/B) must match the ARGO_URL_A/ARGO_URL_B pair in the
    # ConfigMap -- config.py links them by that shared suffix. Scripts
    # without an argo_target arg never touch these -- they use ARGO_TOKEN
    # in eden-secrets as today.
    eden-argo-tokens:
      data:
        ARGO_TOKEN_A="aaaaaaaaaaaaaa"
        ARGO_TOKEN_B="aaaaaaaaaaaaaa"
      envTo:
        eden

  ingresses:
    eden:
      hosts: 
        - "eden.com"
          paths:
            - "/"
      tls:
        hosts:
          - "eden.com"
          - "eden"
        crt: "aaaaaaaaaaaaaa"
        key: "aaaaaaaaaaaaaa"
      annotations:
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
        